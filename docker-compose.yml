# Base de données locale pour le développement : docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tunexa
      POSTGRES_USER: tunexa
      POSTGRES_PASSWORD: tunexa
    ports:
      - "5432:5432"
    volumes:
      - tunexa-db:/var/lib/postgresql/data

volumes:
  tunexa-db:
